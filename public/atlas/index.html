<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Afterimage Atlas: subculture aesthetics, each rendered live with real reference images.">
<meta property="og:title" content="Afterimage Atlas">
<meta name="theme-color" content="#07060c">
<link rel="apple-touch-icon" href="/atlas/icon.png">
<meta property="og:image" content="https://atlas.symbiozefpv.com/atlas/icon.png">
<title>Afterimage Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;700&family=VT323&family=Rubik+Glitch&family=IBM+Plex+Mono:wght@400;600&family=Syncopate:wght@700&family=Varela+Round&family=Zen+Old+Mincho:wght@700&family=Bagel+Fat+One&family=Silkscreen&family=Major+Mono+Display&family=Pirata+One&family=Anton&family=UnifrakturCook:wght@700&family=Cormorant+Garamond:ital,wght@1,600&family=Fredoka:wght@600&family=Grenze+Gotisch:wght@600&family=UnifrakturMaguntia&family=Metal+Mania&family=Special+Elite&family=Permanent+Marker&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
html{color-scheme:dark}
/* Layout: fixed GPU shader canvas behind everything; a floating 3D object top-right of each page; a wall of generated canvases (logo, cover, flyer, glyph, texture, loop, specimen). Single dark world by design. */
:root{
  --ground:#07060c;
  --fb:linear-gradient(135deg,#1a0f3a,#06222b 50%,#2a0a24);
  --ink:#f3f0ff; --mut:#bdb6d6; --line:rgba(243,240,255,.18); --panel:rgba(10,8,20,.58); --acc:#7bf7ff;
  --r:18px; --blur:16px; --chipr:999px; --bullet:'✦';
  --f-disp:'Unbounded',system-ui,sans-serif; --f-body:'Bricolage Grotesque',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
  --tfont:var(--f-disp); --bfont:var(--f-body);
  color-scheme:dark;
}
html{background:var(--ground);color:var(--ink)}
html:has(body.nogl){background:var(--fb)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;overflow-x:hidden;color:var(--ink);background:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#000}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block;background:var(--ground)}
.nogl #gl{display:none}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.wrap{position:relative;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.top a,.top button{pointer-events:auto;text-decoration:none;color:var(--ink);font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);white-space:nowrap;cursor:pointer}
.top .brand{font-family:var(--f-disp);font-weight:800;letter-spacing:.1em}
.top .grp{display:flex;gap:8px}
#snd .bar{display:inline-block;width:3px;height:10px;background:var(--acc);margin-right:2px;vertical-align:middle;transform-origin:bottom;opacity:.4}
#snd.on .bar{animation:eq .6s ease-in-out infinite alternate;opacity:1}
#snd .bar:nth-child(2){animation-delay:-.2s}#snd .bar:nth-child(3){animation-delay:-.4s}
@keyframes eq{from{transform:scaleY(.3)}to{transform:scaleY(1)}}

#view.in{animation:enter .75s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(18px);filter:blur(10px)}}
#three{position:absolute;right:0;top:0;width:min(62vw,560px);height:min(62vw,560px);z-index:1;pointer-events:none;filter:drop-shadow(0 30px 50px rgba(0,0,0,.5))}
@media (max-width:700px){#three{width:70vw;height:70vw;right:-10%;top:-4%;opacity:.85}}

/* ---------- HUB ---------- */
.hero{max-width:1240px;margin:0 auto;padding-top:calc(100px + env(safe-area-inset-top,0px));padding-bottom:36px;position:relative}
.kicker{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;display:flex;gap:10px;flex-wrap:wrap;margin:0;position:relative;z-index:2}
.kicker span{padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px)}
.mega{font-family:var(--f-disp);font-weight:900;font-size:clamp(68px,18vw,280px);line-height:.8;letter-spacing:-.05em;margin:22px 0 0;color:#fff;mix-blend-mode:difference;transform-style:preserve-3d;will-change:transform;position:relative;z-index:2}
.mega .l{display:inline-block;animation:bob 6s ease-in-out infinite;animation-delay:calc(var(--i) * -.3s)}
@keyframes bob{50%{transform:translateY(-.045em) rotateX(22deg) skewX(-4deg)}}
.lede{max-width:40ch;font-size:clamp(16px,2vw,21px);font-weight:600;line-height:1.4;margin:26px 0 0;text-shadow:0 1px 2px rgba(0,0,0,.6),0 2px 22px rgba(0,0,0,.75);position:relative;z-index:2}

.ring-sec{max-width:1240px;margin:0 auto;padding-block:8px 28px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;border-top:1px solid var(--line);padding-top:14px;text-shadow:0 1px 10px rgba(0,0,0,.8)}
.stage{position:relative;height:calc(var(--ch,230px) * 1.75);overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.stage:active{cursor:grabbing}
.ring{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.card{position:absolute;width:var(--cw,176px);height:var(--ch,232px);left:calc(var(--cw,176px) / -2);top:calc(var(--ch,232px) / -2);border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.3);background:#111 center/cover no-repeat;box-shadow:0 30px 60px rgba(0,0,0,.55);color:#fff;text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;-webkit-user-drag:none}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.8));pointer-events:none}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 48%,transparent 62%);mix-blend-mode:overlay;pointer-events:none}
.card .nm,.card .fm{position:relative;z-index:1}
.card .nm{font-size:clamp(17px,2vw,22px);line-height:1}
.card .fm{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;margin-top:7px}

.wall{max-width:1240px;margin:0 auto;padding-block:8px 40px}
.fams{display:grid;gap:22px}
.fam h2{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 10px;color:var(--ink);text-shadow:0 1px 10px #000;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.tile{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#111 center/cover;border:1px solid rgba(255,255,255,.22);text-decoration:none;color:#fff;display:flex;align-items:flex-end;padding:10px;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;transform-style:preserve-3d}
.tile:hover{transform:translateY(-6px) scale(1.04);box-shadow:0 30px 50px rgba(0,0,0,.6);z-index:2}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.8))}
.tile span{position:relative;z-index:1;font-size:16px;line-height:1}
.tile .cnt{position:absolute;top:8px;right:8px;z-index:1;font:700 10px/1 ui-monospace,monospace;background:#000;color:#fff;padding:5px 7px;border-radius:999px;border:1px solid rgba(255,255,255,.4)}
.tile .cnt:empty{display:none}
.foot{max-width:1240px;margin:0 auto;padding-block:20px 48px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;border-top:1px solid var(--line);text-shadow:0 1px 10px rgba(0,0,0,.8)}

/* ---------- STYLE PAGE ---------- */
.sp{max-width:1240px;margin:0 auto;padding-top:calc(84px + env(safe-area-inset-top,0px));padding-bottom:56px;color:var(--ink);font-family:var(--bfont)}
.sp-head{position:relative;min-height:min(50vw,440px);overflow:visible}
.sp,.hero{overflow:hidden}
.sp-kick{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;display:flex;gap:8px;flex-wrap:wrap;margin:0;position:relative;z-index:2}
.sp-kick span{padding:6px 11px;border:1px solid var(--line);border-radius:var(--chipr);background:var(--panel);color:var(--ink);backdrop-filter:blur(8px)}
.sp-title{font-family:var(--tfont);font-weight:400;font-size:clamp(54px,12.5vw,190px);line-height:.92;margin:26px 0 16px;color:var(--ink);text-wrap:balance;overflow-wrap:break-word;position:relative;z-index:2;max-width:9ch}
.sp-tag{display:inline-block;font-size:clamp(16px,2.2vw,23px);line-height:1.3;max-width:34ch;margin:0;padding:.35em .65em;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);backdrop-filter:blur(var(--blur));position:relative;z-index:2}
.mq{position:relative;z-index:2;margin:26px 0 0;overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);backdrop-filter:blur(var(--blur));white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq div{display:inline-block;padding:10px 0;font-family:var(--tfont);font-size:clamp(22px,3.4vw,42px);line-height:1;animation:mq 28s linear infinite}
.mq span{margin:0 .7em}.mq i{font-style:normal;color:var(--acc)}
@keyframes mq{to{transform:translateX(-50%)}}
.real{columns:4 220px;column-gap:10px;position:relative;z-index:2;margin-top:16px}
.real figure{break-inside:avoid;margin:0 0 10px}
.real .src,.real .drop{column-span:all}
.real figure.open{cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:96vw;max-height:88vh;width:auto;height:auto;box-shadow:0 40px 120px #000}
.lb .cap{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:#000;padding:8px 12px;border-radius:999px;max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .cap a{color:var(--acc)}
.sp .src .tbt{margin-left:12px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:#fff;background:#000;border:1px solid #fff;border-radius:999px;padding:4px 10px;cursor:pointer}
@media(max-width:480px){.top a,.top button{padding:8px 10px;letter-spacing:.1em;font-size:10px}}
.els .src{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 14px}
.real figure.ok::after{content:"";position:absolute;left:6px;top:6px;width:8px;height:8px;border-radius:50%;background:#3f6;box-shadow:0 0 6px #3f6}
body.noscroll{overflow:hidden;touch-action:none}
.feed{position:fixed;inset:0;z-index:60;background:#000;color:#fff;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);overscroll-behavior:contain}
.feed .fh,.feed .fb{min-width:0;max-width:100%}
.feed .fh{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px;min-height:44px}
.feed .fh .src{color:#9cf;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34vw;flex:0 1 auto}.feed .fh .n{flex:0 0 auto;white-space:nowrap}
.feed .fh .chip{flex:1;text-align:right;color:#aaa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed .okdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3f6;box-shadow:0 0 6px #3f6;vertical-align:middle;margin-left:6px}
.feed .fx,.cut .fx{font:inherit;color:#fff;background:#111;border:1px solid #444;border-radius:999px;width:38px;height:38px;cursor:pointer;flex:none;touch-action:manipulation}
.feed .fstage{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.feed .fc{position:absolute;inset:0;display:grid;place-items:center;transition:transform .22s ease-out;will-change:transform}
.feed .fc img{width:100%;height:100%;object-fit:contain;-webkit-touch-callout:none;pointer-events:none}
.feed .fc[data-hint]::after{content:attr(data-hint);position:absolute;top:18px;font-size:22px;letter-spacing:.3em;padding:8px 18px;border:3px solid;border-radius:8px;transform:rotate(-8deg)}
.feed .fc[data-hint=kill]::after{left:18px;color:#f44;border-color:#f44}.feed .fc[data-hint=keep]::after{right:18px;color:#3f6;border-color:#3f6}
.feed .fb{display:flex;gap:6px;justify-content:center;align-items:center;padding:10px 10px calc(14px + env(safe-area-inset-bottom,0px))}
.feed .fb>*{flex:0 1 auto;min-width:0}.feed .fb select{flex:1 1 90px;max-width:160px;text-overflow:ellipsis}
@media(max-width:420px){.feed .fb button,.feed .fb select{padding:10px 10px;letter-spacing:.08em}}
.feed .fb button,.feed .fb select,.cut .ch button,.cut .cf button,.cut .cf input{font:inherit;letter-spacing:inherit;text-transform:inherit;color:#fff;background:#111;border:1px solid #444;border-radius:999px;padding:11px 14px;cursor:pointer;touch-action:manipulation}
.feed .fb [data-act=kill]{border-color:#f44;color:#f88}.feed .fb [data-act=keep]{border-color:#3f6;color:#8f9}.feed .fb [data-act=undo]{padding:11px 12px}
.feed .fs{position:absolute;inset:0;display:none;place-items:center;pointer-events:none;font-size:30px;letter-spacing:.3em;background:rgba(0,0,0,.35)}
.feed.elmode .fstage{background:conic-gradient(#2a2a2a 25%,#444 0 50%,#2a2a2a 0 75%,#444 0) 0 0/24px 24px}.feed.elmode .fc img{object-fit:contain;padding:6%;box-sizing:border-box}
.feed .fs[data-state]{display:grid}.feed .fs[data-state=killed] b{color:#f55}.feed .fs[data-state=kept] b{color:#3f6}
.cut{position:fixed;inset:0;z-index:70;background:#000;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);color:#fff;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.cut .ch{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;flex-wrap:wrap}
.cut .modes{display:flex;gap:6px}.cut .modes button.on{background:#fff;color:#000;border-color:#fff}
.cut .rng{display:flex;align-items:center;gap:8px;flex:1;min-width:160px}.cut .rng input{flex:1;accent-color:#fff}
.cut .cm{position:relative;overflow:hidden;touch-action:none}
.cut .cm canvas{display:block;cursor:crosshair}
.cut .sel{position:absolute;border:2px dashed #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
.cut .hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);margin:0;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:999px;white-space:nowrap}
.cut .cf{display:flex;align-items:center;gap:10px;padding:10px 10px calc(12px + env(safe-area-inset-bottom,0px))}
.cut .cf canvas{width:72px;height:72px;flex:none;border-radius:6px;background:conic-gradient(#333 25%,#555 0 50%,#333 0 75%,#555 0) 0 0/16px 16px}
.cut .cf input{flex:1;min-width:0;cursor:text;text-transform:none;letter-spacing:0}
.cut .cf #save{border-color:#fff}.cut .cf #save:disabled{opacity:.4}
.float{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:visible}
.float img{position:absolute;height:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55));animation:fdrift linear infinite alternate;rotate:var(--r);opacity:.92;will-change:translate}
@keyframes fdrift{from{transform:translate3d(0,0,0) rotate(0)}to{transform:translate3d(calc(var(--d)*28px),calc(var(--d)*-22px),0) rotate(calc(var(--d)*6deg))}}
@media(prefers-reduced-motion:reduce){.float img{animation:none}}
.mapv .hero{margin-bottom:0}
.mapbar{display:flex;align-items:center;gap:12px;margin:14px 0 10px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.mapbar button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:#fff;background:#000;border:1px solid #fff;border-radius:999px;padding:9px 14px;cursor:pointer}.mapbar button:disabled{opacity:.35;cursor:default}
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
@media(min-width:480px){.mosaic{grid-template-columns:repeat(4,1fr)}}@media(min-width:900px){.mosaic{grid-template-columns:repeat(6,1fr)}}
.mtile{margin:0;position:relative;aspect-ratio:1;overflow:hidden;border-radius:10px;background:#111;cursor:pointer;box-shadow:0 0 0 2px var(--c) inset;transition:transform .15s}
.mtile:active{transform:scale(.97)}
.mtile img{width:100%;height:100%;object-fit:cover;display:block}
.mtile figcaption{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.mtile figcaption b{font-family:var(--f-mono);font-size:12px;color:#fff;background:#000;border-radius:999px;padding:3px 7px;min-width:14px;text-align:center}
.mtile .mix{display:flex;height:5px;flex:1;border-radius:3px;overflow:hidden;background:#000}.mtile .mix i{display:block;height:100%}
#mapchips button i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chips button{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
.chips button.on{background:var(--ink);color:#000;border-color:var(--ink)}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.mgrid .mc{margin:0;position:relative;border-radius:8px;overflow:hidden;background:#111;aspect-ratio:9/16;cursor:pointer;border:1px solid rgba(255,255,255,.08)}
.mgrid .mc img{width:100%;height:100%;object-fit:cover;display:block}
.mgrid .mc figcaption{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgrid .mc i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.5)}
.mgrid .mc i::after{content:"";position:absolute;left:18px;top:14px;border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
.mgrid .mc.ok{outline:2px solid #7bf7ff}.mgrid .mc.dead{opacity:.25}
.mplay{position:fixed;inset:0;z-index:60;background:#000;display:grid;grid-template-rows:auto minmax(0,1fr) auto;color:#fff}
.mplay video{width:100%;height:100%;object-fit:contain;background:#000}
.mplay .mh,.mplay .mf{display:flex;gap:10px;align-items:center;padding:10px 14px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;min-width:0}
.mplay .mh span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mplay .mf{justify-content:center;flex-wrap:wrap}
.mplay button,.mplay a.tbt{background:#1b1b1b;border:1px solid rgba(255,255,255,.25);color:#fff;padding:9px 14px;border-radius:999px;font:inherit;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.mplay button.on{background:#7bf7ff;color:#000}.mplay button.kill.on{background:#ff4fd8}
.mplay .x{margin-left:auto}
.mplay .mbar{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:10px;padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
.mplay .mbar>*{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;padding:8px 6px;border-radius:16px;font-size:11px;letter-spacing:.08em}

async function mountMap(){
  const data=MAPD||(MAPD=await jget("/atlas/map.json",{cache:"no-cache"}));
  const box=$("#mosaic");if(!box)return;
  if(!data||!data.pts){box.innerHTML='<p class="src">No map yet — it is built by the nightly job.</p>';return;}
  await manifest();
  const pts=data.pts.map(p=>({id:p[0],s:p[1],x:p[2],y:p[3],ok:p[4]}));const col={};STYLES.forEach(st=>col[st.id]=(st.v&&st.v.acc)||"#fff");

function genThumbs(){
  const c=document.createElement("canvas");c.width=216;c.height=284;const ctx=initGL(c);if(!ctx)return;let i=0;
  const step=()=>{for(let k=0;k<3&&i<N;k++,i++){const s=STYLES[i];drawGL(ctx,216,284,8+i*1.7,s.mode,.5,.5,0);try{s.thumb=c.toDataURL("image/jpeg",.84);}catch(e){}}
    applyThumbs();if(i<N)setTimeout(step,24);else{const x=ctx.gl.getExtension("WEBGL_lose_context");x&&x.loseContext();const s=byId[location.hash.slice(1)];if(s)buildExhibitsRefresh(s);}};
  step();
}
function buildExhibitsRefresh(s){const ex=$("#ex");if(!ex)return;ex.innerHTML="";buildExhibits(s);}
route();
requestAnimationFrame(frame);
setTimeout(genThumbs,250);
})();
</script>
