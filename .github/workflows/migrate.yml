# One-off: copy the atlas from the main site's bucket into this Worker's bucket. Manual only. Delete after it has run.
name: atlas migrate
on:
  workflow_dispatch:
    inputs:
      only:
        description: "only these styles' images (comma list), empty = everything"
        default: ""
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - name: copy
        env:
          OLD_ATLAS_TOKEN: ${{ secrets.OLD_ATLAS_TOKEN }}
          ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
          ONLY: ${{ github.event.inputs.only }}
        run: python curator/migrate.py
      - name: redeploy (Cloudflare deploy hook)
        if: always()
        env:
          DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
        run: if [ -n "$DEPLOY_HOOK" ]; then curl -fsS -o /dev/null -X POST "$DEPLOY_HOOK" && echo "build triggered"; fi
      - name: commit report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "atlas bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git add curator/last-migrate.md && git commit -q -m "migrate: report" && git pull -q --rebase origin main && git push -q origin HEAD:main
