# One-off: copy the atlas from the main site's bucket into this Worker's bucket. Manual only. Delete after it has run.
name: atlas migrate
on:
  workflow_dispatch:
    inputs:
      only:
        description: "only these styles' images (comma list), empty = everything"
        default: ""
permissions:
  contents: read
  issues: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - name: copy
        env:
          OLD_ATLAS_TOKEN: ${{ secrets.OLD_ATLAS_TOKEN }}
          ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
          ONLY: ${{ github.event.inputs.only }}
        run: python curator/migrate.py
      - name: redeploy (Cloudflare deploy hook)
        if: always()
        env:
          DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
        run: if [ -n "$DEPLOY_HOOK" ]; then curl -fsS -o /dev/null -X POST "$DEPLOY_HOOK" && echo "build triggered"; fi
      - name: commit report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="report: migrate"; N=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "in:title $T" --json number,title --jq ".[] | select(.title==\"$T\") | .number" | head -1)
          if [ -z "$N" ]; then gh issue create --repo "$GITHUB_REPOSITORY" --title "$T" --body-file curator/last-migrate.md >/dev/null; else gh issue edit "$N" --repo "$GITHUB_REPOSITORY" --body-file curator/last-migrate.md >/dev/null; fi
          echo "report posted to issue: $T"