# Nightly auto cut-outs: FastSAM + ISNet + CLIP on free GitHub minutes. Candidates go to the Cuts review feed.
name: atlas extractor
on:
  schedule:
    - cron: "50 */2 * * *"   # every 2 hours
  workflow_dispatch:
    inputs:
      cap:
        description: "images to process this run"
        default: "500"
permissions:
  contents: read
  issues: write
concurrency: extractor
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: curator/requirements-extract.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.u2net
            FastSAM-x.pt
          key: extractor-models-v1
      - run: pip install -r curator/requirements-extract.txt
      - name: extract
        env:
          ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
          EXTRACT_CAP: ${{ github.event.inputs.cap || '500' }}
        run: '[[ "$EXTRACT_CAP" =~ ^[0-9]{1,4}$ ]] && python curator/extract.py --cap "$EXTRACT_CAP"'
      - name: commit run report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="report: extractor"; N=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "in:title $T" --json number,title --jq ".[] | select(.title==\"$T\") | .number" | head -1)
          if [ -z "$N" ]; then gh issue create --repo "$GITHUB_REPOSITORY" --title "$T" --body-file curator/last-extract.md >/dev/null; else gh issue edit "$N" --repo "$GITHUB_REPOSITORY" --body-file curator/last-extract.md >/dev/null; fi
          echo "report posted to issue: $T"