# Nightly auto cut-outs: FastSAM + ISNet + CLIP on free GitHub minutes. Candidates go to the Cuts review feed.
name: atlas extractor
on:
  schedule:
    - cron: "50 2-23/4 * * *"   # every 4 hours
  workflow_dispatch:
    inputs:
      cap:
        description: "images to process this run"
        default: "180"
permissions:
  contents: write
concurrency: extractor
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: curator/requirements-extract.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.u2net
            FastSAM-x.pt
          key: extractor-models-v1
      - run: pip install -r curator/requirements-extract.txt
      - name: extract
        env:
          ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
          EXTRACT_CAP: ${{ github.event.inputs.cap || '180' }}
        run: '[[ "$EXTRACT_CAP" =~ ^[0-9]{1,4}$ ]] && python curator/extract.py --cap "$EXTRACT_CAP"'
      - name: commit run report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "atlas bot"; git config user.email "curator@users.noreply.github.com"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          cp curator/last-extract.md /tmp/report.md
          for i in 1 2 3 4 5; do
            git reset -q --hard && git fetch -q origin main && git checkout -q -B main origin/main
            cp /tmp/report.md curator/last-extract.md
            git add curator/last-extract.md
            if git diff --cached --quiet; then echo "no report change"; break; fi
            if git commit -q -m "extractor: run report" && git push -q origin main; then echo "report pushed"; break; fi
            echo "push rejected, retrying ($i)"; sleep $((i*15))
          done
