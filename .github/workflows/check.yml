# Live check of the atlas from outside: pages, data, files. Writes curator/last-check.md.
name: atlas check
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: probe
        run: |
          S=https://atlas.symbiozefpv.com; O=curator/last-check.md
          echo "# live check $(date -u '+%Y-%m-%d %H:%M UTC')" > $O; echo >> $O
          for u in / /atlas/ /atlas/manifest.json /atlas/elements.json /atlas/mont.json /api/atlas/stats /api/atlas/flags /admin /atlas/icon.png; do
            echo "- \`$u\` → $(curl -s -o /tmp/b -w '%{http_code} %{content_type} %{size_download}B' "$S$u")" >> $O
          done
          python3 - >> $O <<'PY'
          import json, urllib.request
          S = "https://atlas.symbiozefpv.com"
          def get(u): return urllib.request.urlopen(urllib.request.Request(S + u, headers={"user-agent": "atlas-check"}), timeout=30)
          m = json.load(get("/atlas/manifest.json")); st = m.get("styles", m)
          n = sum(len(v) for v in st.values()); print(f"\n- manifest: {n} images in {len(st)} styles")
          h = get("/atlas/").read().decode()
          print("- page has: archive=" + str("march" in h) + " new-label=" + str("New · " in h) + " seen3s=" + str("Math.min(3,v.duration" in h) + " safe-saves=" + str("SAVING=" in h) + " seen-strip=" + str("mseenh" in h) + " video-upload=" + str("vidbtn" in h and "/api/atlas/vid/part" in h))
          import urllib.error
          for u, meth in (("/api/atlas/vid", "GET"), ("/api/atlas/vid/start", "POST")):
              try: urllib.request.urlopen(urllib.request.Request(S + u, method=meth, data=b"{}" if meth == "POST" else None, headers={"user-agent": "atlas-check", "content-type": "application/json", "origin": S}), timeout=30); print(f"- {u} without login → 200 (BAD: should refuse)")
              except urllib.error.HTTPError as e_: print(f"- {u} without login → {e_.code} (should be 403)")
          print("- memes: " + str(len(st.get("meme", []))) + ", pop culture: " + str(len(st.get("pop", []))))
          first = next(iter(st.values()))[0]; th = first.get("th") or first.get("url")
          print(f"- thumbnail `{th}` → {get(th).status}")
          o = first.get("url"); print(f"- original `{o}` → {get(o).status}")
          e = json.load(get("/atlas/elements.json")).get("items", []); print(f"- elements: {len(e)}")
          if e: print(f"- element file → {get('/atlas/el/' + e[0]['id'] + '.webp').status}")
          mt = json.load(get("/atlas/mont.json")).get("items", []); print(f"- edits: {len(mt)}")
          for it_ in mt[:4] + mt[40:42]:
              try: r = get(it_["mp4"]); print(f"- edit video `{it_['mp4']}` made {it_.get('made')} → {r.status} {r.headers.get('content-length')}B")
              except Exception as e_: print(f"- edit video `{it_.get('mp4')}` made {it_.get('made')} → {getattr(e_, 'code', e_)}")
          PY
      - name: video upload plumbing (start, one part, abort, leaves nothing behind)
        if: always()
        env:
          ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
        run: |
          S=https://atlas.symbiozefpv.com; O=curator/last-check.md; H="authorization: Bearer $ATLAS_TOKEN"
          head -c 6000000 /dev/urandom > /tmp/part
          J=$(curl -s -X POST -H "$H" -H "content-type: application/json" -d '{"name":"check.mp4","type":"video/mp4","size":6000000}' $S/api/atlas/vid/start)
          K=$(echo "$J" | python3 -c "import sys,json;print(json.load(sys.stdin).get('key',''))"); U=$(echo "$J" | python3 -c "import sys,json;print(json.load(sys.stdin).get('up',''))")
          P=$(curl -s -X PUT -H "$H" --data-binary @/tmp/part "$S/api/atlas/vid/part?key=$K&up=$U&n=1")
          A=$(curl -s -X POST -H "$H" -H "content-type: application/json" -d "{\"key\":\"$K\",\"up\":\"$U\"}" $S/api/atlas/vid/abort)
          echo "- video upload: start → ${K:+ok} | part → $P | abort → $A" >> $O
          curl -s -H "$H" "$S/api/atlas/cur/obj?o=atlas/static.json" | python3 -c "import sys,json;d=json.load(sys.stdin);print('- static.json: built', d.get('built'), 'mont_at', d.get('mont_at'), 'parts', [(p['key'], p.get('bytes')) for p in d.get('parts', []) if '9' in p['key'][-8:-4]][:6], 'n', len(d.get('parts', [])))" >> $O
          echo "- vid.json raw → $(curl -s -o /tmp/vid.json -w '%{http_code}' -H "$H" "$S/api/atlas/cur/obj?o=atlas/vid.json") $(head -c 600 /tmp/vid.json)" >> $O
          curl -s -H "$H" "$S/api/atlas/cur/obj?o=atlas/vid.json" | python3 -c "import sys,json,time
          d=json.load(sys.stdin) if sys.stdin.readable() else {}
          for x in d.get('items', []): print(f\"- your video: {x.get('name')} | {round(x.get('size',0)/1e6)} MB | {x.get('state')} | clips {len(x.get('clips',[]))} | {x.get('why','')} | uploaded {int((time.time()-x.get('added',0))/60)} min ago\")
          print('- your videos: none yet' if not d.get('items') else '')" >> $O || echo "- your videos: none yet" >> $O
          for id in $(curl -s $S/atlas/mont.json | python3 -c "import sys,json;print(' '.join(x['id'] for x in json.load(sys.stdin)['items'][:3]))"); do echo "- R2 mont/$id.mp4 → $(curl -s -o /dev/null -w '%{http_code} %{size_download}B' -H "$H" "$S/api/atlas/cur/obj?o=atlas/mont/$id.mp4")" >> $O; done
      - name: commit report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="report: check"; N=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "in:title $T" --json number,title --jq ".[] | select(.title==\"$T\") | .number" | head -1)
          if [ -z "$N" ]; then gh issue create --repo "$GITHUB_REPOSITORY" --title "$T" --body-file curator/last-check.md >/dev/null; else gh issue edit "$N" --repo "$GITHUB_REPOSITORY" --body-file curator/last-check.md >/dev/null; fi
          echo "report posted to issue: $T"